[project]
name = "gptzero-human-writing"
version = "1.0.0"
description = "Code for the post \"Which Human Writing Does GPTZero Call AI?\": recompute its numbers, tables and figures from the dataset, and the scripts behind it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["huggingface_hub>=0.23"]

[project.optional-dependencies]
figures = ["pillow>=10"]
collect = ["trafilatura==2.3.1"]
detectors = ["torch>=2.4", "transformers>=4.46", "scipy>=1.13", "numpy>=1.26", "pandas>=2.2", "datasets>=3.0"]
generation = ["vllm>=0.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
